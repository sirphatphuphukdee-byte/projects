<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>เข้าสู่ระบบ | Greenly</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body class="auth-page">

    <div
        class="leaf-container"
        id="leafContainer"
    ></div>


    <header class="navbar">

        <div class="container nav-content">

            <a
                href="index.html"
                class="logo"
            >
                🌿 Greenly
            </a>


            <div class="nav-actions">

                <button
                    class="icon-btn"
                    id="themeToggle"
                >
                    🌙
                </button>

                <a
                    href="register.html"
                    class="login-nav-btn"
                >
                    สมัครสมาชิก
                </a>

            </div>

        </div>

    </header>


    <main class="auth-container">

        <div class="auth-card login-card">


            <div class="auth-image">

                <div class="auth-image-content">

                    <span>
                        🌿 GREENLY
                    </span>

                    <h1>

                        Welcome
                        <br>
                        Back

                    </h1>

                    <p>

                        กลับมาพบกับต้นไม้
                        ที่คุณชื่นชอบอีกครั้ง

                    </p>

                </div>

            </div>


            <div class="auth-form">

                <div class="auth-header">

                    <span>
                        WELCOME BACK
                    </span>

                    <h2>
                        เข้าสู่ระบบ
                    </h2>

                    <p>
                        เข้าสู่บัญชี Greenly ของคุณ
                    </p>

                </div>


                <form id="loginForm">


                    <div class="form-group">

                        <label>
                            อีเมล
                        </label>

                        <div class="input-wrapper">

                            <span>
                                ✉️
                            </span>

                            <input
                                type="email"
                                id="loginEmail"
                                placeholder="example@email.com"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            รหัสผ่าน
                        </label>

                        <div class="input-wrapper">

                            <span>
                                🔒
                            </span>

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="รหัสผ่าน"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="
                                    togglePassword(
                                        'loginPassword',
                                        this
                                    )
                                "
                            >
                                👁️
                            </button>

                        </div>

                    </div>


                    <div class="login-options">

                        <label>

                            <input
                                type="checkbox"
                            >

                            จำฉันไว้

                        </label>


                        <a href="#">
                            ลืมรหัสผ่าน?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                    >

                        🌿 เข้าสู่ระบบ

                    </button>


                    <div class="auth-footer">

                        <span>
                            ยังไม่มีบัญชี?
                        </span>

                        <a href="register.html">
                            สมัครสมาชิก
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>


    <div
        class="toast"
        id="toast"
    ></div>


    <script src="login.js"></script>

</body>

</html>
